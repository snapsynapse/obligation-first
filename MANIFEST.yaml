# Obligation-First Content Provenance Manifest
#
# Tracks SHA-256 hashes of canonical Obligation-First content for tamper
# detection and reproducibility. Run `npm run validate:hashes` to verify,
# or `npm run hashes:update` to recompute after intentional
# edits.
#
# Hash mechanism adapted from skill-provenance (https://skillprovenance.dev)
# and PubLedge. We adopt the integrity pattern, not the full provenance
# protocol.
#
# What gets hashed:
#   - Spec prose (PROTOCOL.md, PRIOR-ART.md, INTENT.md, ROADMAP.md)
#   - JSON-LD context (schema/context.jsonld)
#   - JSON Schemas (schema/*.schema.json)
#   - Vendored upper ontology snapshot (vendor/gist/*)
#   - Worked examples (examples/**)
#   - Crosswalks (reference/crosswalks/*)
#   - License files
#
# What does NOT get hashed:
#   - This file (MANIFEST.yaml is the control file)
#   - Workshop scratchpad (_workshop/) — not a stable contract
#   - Editor / OS artifacts (.DS_Store, etc.)
#   - Build outputs

