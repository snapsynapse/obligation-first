name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync schema/, imgs/, and worked-example records into docs/v1/
        run: |
          mkdir -p docs/v1/schema docs/v1/examples docs/imgs
          cp schema/context.jsonld docs/v1/context.jsonld
          cp schema/*.schema.json docs/v1/schema/
          if [ -d imgs ]; then cp -r imgs/. docs/imgs/; fi
          # Mirror every example with a records/ subdirectory so JSON
          # records dereference at obligationfirst.org/v1/examples/<slug>/records/<file>.json
          for ex in examples/*/; do
            slug=$(basename "$ex")
            if [ -d "$ex/records" ]; then
              mkdir -p "docs/v1/examples/$slug"
              cp -r "$ex/." "docs/v1/examples/$slug/"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
