name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run contract suite before deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Sync schema/, imgs/, and worked-example records into docs/v1/
        run: |
          mkdir -p docs/v1/schema docs/v1/examples docs/imgs
          cp schema/context.jsonld docs/v1/context.jsonld
          cp schema/*.schema.json docs/v1/schema/
          if [ -d imgs ]; then cp -r imgs/. docs/imgs/; fi
          # Mirror every example with a records/ subdirectory so JSON
          # records dereference at obligationfirst.org/v1/examples/<slug>/records/<file>.json
          for ex in examples/*/; do
            slug=$(basename "$ex")
            if [ -d "$ex/records" ]; then
              mkdir -p "docs/v1/examples/$slug"
              cp -r "$ex/." "docs/v1/examples/$slug/"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
