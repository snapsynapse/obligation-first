name: A11y

# Accessibility audit. Manual + monthly cadence rather than per-push because:
# (a) the landing page changes infrequently after v0.1
# (b) the audit needs the deployed live URL, not a local build
# (c) per-push axe runs would burn CI minutes on no-op PRs.
on:
  workflow_dispatch:
  schedule:
    # First Monday of every month, 09:00 UTC. Cron cannot express "first
    # Monday" directly: restricting BOTH day-of-month and day-of-week makes
    # cron fire when EITHER matches (so "0 9 1-7 * 1" ran daily on days 1-7
    # plus every Monday). Instead: fire on days 1-7, gate on Monday in-job.
    - cron: "0 9 1-7 * *"

permissions:
  contents: read

jobs:
  audit:
    name: axe-core scan against obligationfirst.org
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled runs to the first Monday
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (UTC); skipping scheduled run." >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP_AUDIT=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP_AUDIT != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP_AUDIT != 'true'
        with:
          node-version: "20"

      - name: Install puppeteer + axe-core
        if: env.SKIP_AUDIT != 'true'
        run: |
          npm install --no-save puppeteer @axe-core/puppeteer

      - name: Run axe scan
        if: env.SKIP_AUDIT != 'true'
        run: |
          cat > scan.mjs <<'EOF'
          import puppeteer from "puppeteer";
          import { AxePuppeteer } from "@axe-core/puppeteer";

          const url = "https://obligationfirst.org/";
          const browser = await puppeteer.launch({ args: ["--no-sandbox"] });
          const page = await browser.newPage();
          await page.goto(url, { waitUntil: "networkidle0" });
          const results = await new AxePuppeteer(page).analyze();
          await browser.close();

          const v = results.violations;
          console.log(`URL:        ${url}`);
          console.log(`Violations: ${v.length}`);
          console.log(`Passes:     ${results.passes.length}`);
          console.log(`Incomplete: ${results.incomplete.length}`);
          if (v.length > 0) {
            console.log("");
            for (const vio of v) {
              console.log(`  [${vio.impact}] ${vio.id} — ${vio.help} (${vio.nodes.length} nodes)`);
              console.log(`    ${vio.helpUrl}`);
            }
            process.exit(1);
          }
          EOF
          node scan.mjs
